<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/passageiro/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SARCA Passageiro">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SARCA Passageiro">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SARCA Passageiro</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: dark;
      --sarca-bg: #071321;
      --sarca-surface: rgba(13, 27, 43, 0.88);
      --sarca-border: rgba(106, 162, 255, 0.24);
      --sarca-primary: #2c9cdb;
      --sarca-accent: #19c37d;
      --sarca-text: #f4f7fb;
      --sarca-muted: #a4b4c6;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(44, 156, 219, 0.18), transparent 42%),
        linear-gradient(180deg, #06111d 0%, #071321 42%, #0b1828 100%);
      color: var(--sarca-text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    #sarca-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    #sarca-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .sarca-loader__card {
      width: min(100%, 520px);
      padding: 28px;
      border-radius: 28px;
      border: 1px solid var(--sarca-border);
      background: var(--sarca-surface);
      box-shadow: 0 24px 90px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(18px);
    }

    .sarca-loader__eyebrow {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--sarca-primary);
    }

    .sarca-loader__title {
      margin: 0;
      font-size: clamp(32px, 5vw, 52px);
      line-height: 0.94;
      font-weight: 800;
    }

    .sarca-loader__title span {
      display: block;
      color: var(--sarca-accent);
    }

    .sarca-loader__message {
      margin: 18px 0 0;
      color: var(--sarca-muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .sarca-loader__progress {
      position: relative;
      overflow: hidden;
      margin-top: 24px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }

    .sarca-loader__progress::before {
      content: "";
      position: absolute;
      inset: 0;
      width: 38%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--sarca-primary), var(--sarca-accent));
      animation: sarca-loader-slide 1.15s ease-in-out infinite;
    }

    .sarca-loader__hint {
      margin-top: 14px;
      font-size: 13px;
      color: rgba(244, 247, 251, 0.72);
    }

    @keyframes sarca-loader-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(360%); }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="sarca-enhancements.js?v=20261114-moz-phone-login-1" defer></script>
  <script src="sarCa-login-back-link.js?v=20261106-site-back" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
